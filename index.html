<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stopwatch">
    <h1><i class="fa-solid fa-stopwatch"></i> Stopwatch</h1>
    <div class="display" id="display">00:00.00</div>

    <div class="buttons">
      <button id="startBtn" class="start"><i class="fa-solid fa-play"></i> Start</button>
      <button id="stopBtn" class="stop"><i class="fa-solid fa-stop"></i> Stop</button>
      <button id="storeBtn" class="store"><i class="fa-solid fa-floppy-disk"></i> Store</button>
      <button id="resetBtn" class="reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>

    <ul id="storedList"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
